<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="News One Prompter"><title>News One Production Teleprompter</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#07090d;color:#fff}button,select,input{font:inherit}button{touch-action:manipulation}
header{height:64px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;background:#0d1119;border-bottom:1px solid #293241}.brand{font-weight:900;letter-spacing:1.5px}.brand small{display:block;color:#9ba5b5;font-size:10px;margin-top:3px}.pill{padding:8px 12px;border-radius:99px;background:#171e2a;font-weight:800}
#editorMode{height:calc(100% - 64px);display:grid;grid-template-rows:auto 1fr auto}.toolbar{padding:10px;background:#111722;border-bottom:1px solid #293241;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toolbar button,.toolbar select,.toolbar input{height:42px;border:1px solid #354155;background:#1a2230;color:white;border-radius:9px;padding:0 11px}.toolbar button{min-width:44px;font-weight:800}.toolbar .accent{background:#fff;color:#090b10}.toolbar label{color:#aab3c2;font-size:11px}.toolbar input[type=color]{width:46px;padding:5px}
#editor{margin:14px;padding:20px;overflow:auto;background:#fff;color:#111;border-radius:15px;outline:none;font-size:28px;line-height:1.45;box-shadow:0 15px 50px #0006}.bottom{padding:10px 14px;background:#0d1119;display:flex;gap:10px;justify-content:center}.bottom button{border:0;border-radius:12px;padding:14px 20px;font-weight:900}.go{background:#fff;color:#090b10}.save{background:#1c2635;color:#fff}
#promptMode{display:none;position:fixed;inset:0;background:#050609;color:#fff;z-index:50}.promptTop{position:absolute;z-index:60;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#050609,transparent)}#promptStatus{font-weight:900}.exit{border:1px solid #555;background:#1118;color:#fff;border-radius:10px;padding:10px 14px}
#viewport{position:absolute;inset:0;overflow:hidden}.guide{position:absolute;z-index:55;left:3%;right:3%;top:48%;height:2px;background:#ef233c99}.promptText{position:absolute;top:44%;left:7%;right:7%;padding:48vh 0 60vh;text-align:center;font-size:64px;line-height:1.4}.promptText img{max-width:100%}.mirror .promptText{transform:scaleX(-1)}
#count{display:none;position:absolute;z-index:100;inset:0;background:#050609f7;place-items:center;font-size:min(42vw,330px);font-weight:900}#count.on{display:grid}
.floating{position:absolute;z-index:70;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#0c1119dd;border:1px solid #313b4c;border-radius:16px;padding:9px}.floating button{min-width:58px;height:48px;border:1px solid #3c485d;border-radius:10px;background:#192230;color:#fff;font-weight:900}.floating .play{background:#fff;color:#080a0e}.floating .stop{background:#4c1119;color:#ff8b98}
.settings{padding:8px 14px;background:#101620;border-top:1px solid #293241;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}.setting{display:flex;align-items:center;gap:7px;color:#abb5c4;font-size:12px;font-weight:700}.setting input[type=range]{width:120px}.setting input[type=number]{width:58px;background:#192230;color:#fff;border:1px solid #3a4659;border-radius:8px;padding:8px}
@media(max-width:700px){#editor{font-size:22px;margin:8px}.promptText{font-size:48px;left:5%;right:5%}.toolbar{max-height:160px;overflow:auto}.brand{font-size:14px}}
</style></head><body>
<header><div class="brand">N1 • NEWS ONE PRODUCTION<small>TABLET TELEPROMPTER STUDIO</small></div><div class="pill">SCRIPT EDITOR</div></header>
<section id="editorMode"><div class="toolbar">
<button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button><button onclick="cmd('underline')"><u>U</u></button>
<select onchange="cmd('fontName',this.value)"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Times New Roman</option></select>
<select onchange="fontSize(this.value)"><option value="20">20</option><option value="24">24</option><option value="28" selected>28</option><option value="32">32</option><option value="36">36</option><option value="42">42</option><option value="48">48</option><option value="56">56</option><option value="64">64</option></select>
<input type="color" value="#111111" onchange="cmd('foreColor',this.value)">
<button onclick="cmd('justifyLeft')">≡</button><button onclick="cmd('justifyCenter')">≡C</button><button onclick="cmd('justifyRight')">≡R</button>
<button onclick="cmd('insertUnorderedList')">• List</button><button onclick="cmd('insertOrderedList')">1. List</button>
<button onclick="cmd('removeFormat')">Clear</button><button class="accent" onclick="pastePlain()">PASTE</button>
</div><div id="editor" contenteditable="true"><h2>News One Production</h2><p>Paste or type your formatted script here.</p></div>
<div><div class="settings"><span class="setting">SPEED <input id="speed" type="range" min="5" max="160" value="45"><b id="speedV">45</b></span><span class="setting">PROMPTER SIZE <input id="pSize" type="range" min="28" max="120" value="64"><b id="sizeV">64</b></span><span class="setting">LINE SPACE <input id="line" type="range" min="10" max="25" value="14"><b id="lineV">1.4</b></span><span class="setting">COUNTDOWN <input id="secs" type="number" min="0" max="30" value="5"> sec</span></div><div class="bottom"><button class="save" onclick="saveAll()">SAVE SCRIPT</button><button class="go" onclick="openPrompt()">OPEN TELEPROMPTER ▶</button></div></div></section>
<section id="promptMode"><div class="promptTop"><div id="promptStatus">READY</div><button class="exit" onclick="closePrompt()">✕ EDITOR</button></div><div id="viewport"><div class="guide"></div><div id="promptText" class="promptText"></div><div id="count">5</div></div><div class="floating"><button class="stop" onclick="restart()">↺</button><button onclick="slower()">− SPEED</button><button class="play" onclick="startCountdown()">▶ START</button><button onclick="togglePlay()">Ⅱ</button><button onclick="faster()">+ SPEED</button><button onclick="smaller()">A−</button><button onclick="larger()">A+</button><button onclick="document.body.classList.toggle('mirror')">⇄</button><button onclick="full()">⛶</button></div></section>
<script>
const $=x=>document.getElementById(x);let playing=false,last=0,offset=0,raf,ct;
function cmd(c,v=null){document.execCommand(c,false,v);$('editor').focus()}function fontSize(px){document.execCommand('fontSize',false,'7');document.querySelectorAll('#editor font[size="7"]').forEach(e=>{e.removeAttribute('size');e.style.fontSize=px+'px'});$('editor').focus()}
async function pastePlain(){try{let t=await navigator.clipboard.readText();document.execCommand('insertText',false,t)}catch(e){alert('Tap and hold inside the editor and choose Paste. Your browser may block the Paste button.')}}
function saveAll(){localStorage.setItem('n1rich', $('editor').innerHTML);localStorage.setItem('n1sp',$('speed').value);localStorage.setItem('n1sz',$('pSize').value);localStorage.setItem('n1ln',$('line').value);localStorage.setItem('n1cd',$('secs').value);$('promptStatus').textContent='SAVED'}
function sync(){ $('speedV').textContent=$('speed').value;$('sizeV').textContent=$('pSize').value;$('lineV').textContent=(+$('line').value/10).toFixed(1);saveAll()}
function openPrompt(){saveAll();$('promptText').innerHTML=$('editor').innerHTML;$('promptText').style.fontSize=$('pSize').value+'px';$('promptText').style.lineHeight=(+$('line').value/10);$('promptMode').style.display='block';restart()}
function closePrompt(){pause();clearInterval(ct);$('count').classList.remove('on');$('promptMode').style.display='none'}
function frame(t){if(!playing)return;if(!last)last=t;offset+=(t-last)/1000*+$('speed').value;last=t;$('promptText').style.top=`calc(44% - ${offset}px)`;raf=requestAnimationFrame(frame)}
function play(){if(playing)return;playing=true;last=0;$('promptStatus').textContent='● PROMPTING';$('promptStatus').style.color='#ff4358';raf=requestAnimationFrame(frame)}
function pause(){playing=false;last=0;cancelAnimationFrame(raf);$('promptStatus').textContent='PAUSED';$('promptStatus').style.color='#fff'}
function togglePlay(){playing?pause():play()}function restart(){pause();offset=0;$('promptText').style.top='44%';$('promptStatus').textContent='READY'}
function startCountdown(){restart();let n=Math.max(0,Math.min(30,parseInt($('secs').value)||0));if(!n)return play();$('count').textContent=n;$('count').classList.add('on');$('promptStatus').textContent='COUNTDOWN';clearInterval(ct);ct=setInterval(()=>{n--;$('count').textContent=n;if(n<=0){clearInterval(ct);$('count').classList.remove('on');play()}},1000)}
function faster(){$('speed').value=Math.min(160,+$('speed').value+5);sync()}function slower(){$('speed').value=Math.max(5,+$('speed').value-5);sync()}function larger(){$('pSize').value=Math.min(120,+$('pSize').value+4);$('promptText').style.fontSize=$('pSize').value+'px';sync()}function smaller(){$('pSize').value=Math.max(28,+$('pSize').value-4);$('promptText').style.fontSize=$('pSize').value+'px';sync()}function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
$('speed').oninput=sync;$('pSize').oninput=sync;$('line').oninput=sync;$('secs').onchange=sync;
let saved=localStorage.getItem('n1rich');if(saved)$('editor').innerHTML=saved;$('speed').value=localStorage.getItem('n1sp')||45;$('pSize').value=localStorage.getItem('n1sz')||64;$('line').value=localStorage.getItem('n1ln')||14;$('secs').value=localStorage.getItem('n1cd')||5;sync();
</script><script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script></body></html>
