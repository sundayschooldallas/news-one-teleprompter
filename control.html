<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News One Production Control Center</title>
<style>
body{margin:0;background:#080d16;color:#fff;font-family:Arial;padding:35px}.box{max-width:900px;margin:auto;background:#101827;border:1px solid #2c3950;border-radius:18px;padding:30px}.top{display:flex;justify-content:space-between}.green{color:#55df8a}.red{color:#ff4358}.count{font-size:150px;font-weight:900;text-align:center;margin:30px}.row{display:flex;gap:12px}.btn{padding:18px;border-radius:12px;border:1px solid #39465b;background:#162033;color:#fff;font-weight:900;cursor:pointer;flex:1}.primary{background:#fff;color:#080b10}.danger{background:#2a0e15;color:#ff6677}input{background:#0a0f18;color:#fff;border:1px solid #39465b;padding:12px;border-radius:8px;width:90px}</style></head>
<body><div class="box"><div class="top"><h1>N1 • NEWS ONE PRODUCTION</h1><b id="sync">● READY</b></div><div class="count" id="count">10</div><div class="row"><button class="btn primary" id="start">● START COUNTDOWN & RECORD</button><button class="btn danger" id="stop">■ STOP RECORDING</button></div><p>Countdown seconds: <input id="secs" type="number" min="0" max="60" value="10"></p><p id="msg">Server ready.</p></div>
<script>
const $=x=>document.getElementById(x);let last=-1;
$('start').onclick=async()=>{let s=Math.max(0,Math.min(60,+$('secs').value||0));await fetch('/api/countdown',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seconds:s})})};
$('stop').onclick=async()=>{await fetch('/api/stop',{method:'POST',cache:'no-store'});$('msg').textContent='STOP sent. Countdown cancelled and recording stopped if active.';};
async function p(){try{let j=await (await fetch('/api/state?x='+Date.now(),{cache:'no-store'})).json();$('sync').textContent=j.recording?'● RECORDING':'● TABLET SYNC CONNECTED';$('sync').className='green';if(j.command==='countdown')$('count').textContent=Math.max(0,Math.ceil((j.targetAt-Date.now())/1000));else $('count').textContent=j.command==='recording'?'●':$('secs').value;$('msg').textContent=j.command==='recording'?(j.recording?'vMix recording active.':'Countdown reached zero; vMix did not confirm recording.'):'Set your countdown and press Start. Recording and scrolling begin only when the countdown reaches 0.'}catch(e){$('sync').textContent='● OFFLINE';$('sync').className='red'}setTimeout(p,300)}p();
</script></body></html>
