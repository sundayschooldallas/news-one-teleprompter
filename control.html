<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News One Production — vMix Recording Control</title>
<style>
:root{--bg:#080b12;--panel:#111724;--panel2:#0d121d;--text:#f7f8fb;--muted:#8e99ab;--line:#232c3c;--accent:#e9eef7;--danger:#ff3b4f;--ok:#33d17a}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#202a3d 0,#0b0f18 38%,#070a10 75%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:28px}
.shell{width:min(980px,100%)} .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;color:#080b12;display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 10px 35px #0008}
.brand h1{font-size:20px;margin:0;letter-spacing:.08em;text-transform:uppercase}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.08em}
.card{background:linear-gradient(180deg,#121927ee,#0c111bee);border:1px solid var(--line);border-radius:26px;box-shadow:0 28px 80px #0009;overflow:hidden;transition:.3s background,.3s border-color,.3s box-shadow}
.card.recording{background:linear-gradient(180deg,#d9001b 0%,#9e0013 52%,#6f000d 100%);border-color:#ff6172;box-shadow:0 28px 90px #000a,0 0 55px #ff183b55}
.card.recording .top{border-bottom-color:#ff8390}
.card.recording .footer{border-top-color:#ff8390;color:#fff}
.card.recording .label,.card.recording .conn,.card.recording .message{color:#fff!important}
.card.recording .count{color:#fff;text-shadow:0 5px 35px #4d0000}
.card.recording .status{color:#fff}
.card.recording .field label{color:#fff}
.card.recording input{background:#5b000b;color:#fff;border-color:#ff8b97}
.card.recording .cancel{background:#69000d;color:#fff;border-color:#ff8b97}
.card.recording .stop{background:#fff;color:#b40017;border-color:#fff}
.card.recording .dot.live{background:#fff;box-shadow:0 0 0 5px #ffffff38,0 0 22px #fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#697386;box-shadow:0 0 0 5px #69738620}.dot.live{background:var(--danger);box-shadow:0 0 0 5px #ff3b4f22,0 0 18px #ff3b4f88}
.conn{font-size:12px;color:var(--muted)} #syncConn.ok{color:var(--ok)} #syncConn.bad{color:var(--danger)} .main{padding:34px 24px 26px;text-align:center}
.label{color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.count{font-variant-numeric:tabular-nums;font-size:clamp(92px,18vw,180px);line-height:1;font-weight:800;letter-spacing:-.06em;margin:16px 0 28px;text-shadow:0 8px 50px #000}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:650px;margin:auto}
button{border:0;border-radius:16px;padding:18px 20px;font-weight:800;font-size:16px;cursor:pointer;transition:.18s transform,.18s opacity,.18s background}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
.start{background:#f4f6fa;color:#0a0d13}.stop{background:#241319;color:#ff6878;border:1px solid #4b202a}.cancel{grid-column:1/-1;background:#171e2b;color:#c9d1df;border:1px solid #293447}
.settings{display:flex;gap:12px;justify-content:center;align-items:end;margin:28px auto 0;flex-wrap:wrap}
.field{text-align:left}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px 4px}
input{width:140px;background:#090e17;color:#fff;border:1px solid #293447;border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
input:focus{border-color:#65728a}.message{min-height:24px;margin-top:22px;color:var(--muted);font-size:13px}
.footer{display:flex;justify-content:space-between;gap:16px;padding:16px 24px;border-top:1px solid var(--line);color:#697386;font-size:11px}
@media(max-width:600px){.controls{grid-template-columns:1fr}.cancel{grid-column:auto}.footer{flex-direction:column}.top{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="logo">N1</div><div><h1>News One Production</h1><p>RECORDING CONTROL CENTER</p></div></div>
  <section id="controlCard" class="card">
    <div class="top">
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">READY</span></div>
      <div style="display:flex;align-items:center;gap:10px"><div id="syncConn" class="conn">Tablet Sync • offline</div><div id="conn" class="conn">vMix • localhost:8088</div></div>
    </div>
    <div class="main">
      <div class="label">Countdown</div>
      <div id="count" class="count">10</div>
      <div class="controls">
        <button id="start" class="start">● START COUNTDOWN & RECORD</button>
        <button id="stop" class="stop">■ STOP RECORDING</button>
        <button id="cancel" class="cancel">CANCEL COUNTDOWN</button>
      </div>
      <div class="settings">
        <div class="field"><label for="seconds">Countdown seconds</label><input id="seconds" type="number" min="1" max="600" value="10"></div>
        <div class="field"><label for="host">vMix API address</label><input id="host" value="127.0.0.1:8088"></div>
      </div>
      <div id="message" class="message">Set your countdown and press Start.</div>
    </div>
    <div class="footer"><span>NEWS ONE PRODUCTION • LOCAL CONTROL</span><span>vMix Web Controller API</span></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
let timer=null, running=false, remaining=10, targetAt=0;

async function syncCommand(command, targetAt=0, seconds=0){
  try{
    const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,targetAt,seconds})});
    if(!r.ok) throw new Error('Sync server '+r.status);
    $('syncConn').textContent='Tablet Sync • connected'; $('syncConn').className='conn ok';
    return true;
  }catch(e){
    $('syncConn').textContent='Tablet Sync • offline'; $('syncConn').className='conn bad';
    return false;
  }
}
async function checkSync(){try{const r=await fetch('/api/state?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;$('syncConn').textContent='Tablet Sync • connected';$('syncConn').className='conn ok'}catch(e){$('syncConn').textContent='Tablet Sync • offline';$('syncConn').className='conn bad'}}
function base(){ return `http://${$('host').value.trim()}/API/`; }
async function vmix(fn){
  const url = base()+`?Function=${encodeURIComponent(fn)}`;
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`vMix returned ${r.status}`);
  return r.text();
}
function save(){
  localStorage.setItem('newsOneCountdown',$('seconds').value);
  localStorage.setItem('newsOneHost',$('host').value);
}
function load(){
  $('seconds').value=localStorage.getItem('newsOneCountdown')||'10';
  $('host').value=localStorage.getItem('newsOneHost')||'127.0.0.1:8088';
  remaining=parseInt($('seconds').value)||10; $('count').textContent=remaining;
}
function setRecording(on){
  $('dot').classList.toggle('live',on);
  $('controlCard').classList.toggle('recording',on);
  $('statusText').textContent=on?'● RECORDING LIVE':'READY';
  document.title=on?'🔴 RECORDING — News One Production':'News One Production — vMix Recording Control';
}
function msg(t,bad=false){$('message').textContent=t;$('message').style.color=bad?'#ff7a87':'';}
async function cancelCountdown(){
  if(timer) clearInterval(timer); timer=null; running=false;
  await syncCommand('cancel');
  $('start').disabled=false;
  remaining=parseInt($('seconds').value)||10;
  $('count').textContent=remaining;
  msg('Countdown cancelled.');
}
$('start').onclick=async()=>{
  if(running)return; save();
  remaining=Math.max(1,Math.min(600,parseInt($('seconds').value)||10));
  targetAt=Date.now()+remaining*1000;
  $('count').textContent=remaining; running=true; $('start').disabled=true;
  await syncCommand('countdown',targetAt,remaining);
  msg('Countdown running — tablet synchronized.');
  timer=setInterval(async()=>{
    remaining--;
    $('count').textContent=String(Math.max(remaining,0)).padStart(2,'0');
    if(remaining<=0){
      clearInterval(timer); timer=null; running=false;
      try{
        await vmix('StartRecording');
        setRecording(true); msg('Recording started.');
      }catch(e){msg('Could not start vMix recording: '+e.message,true)}
      $('start').disabled=false;
    }
  },1000);
};
$('stop').onclick=async()=>{
  await syncCommand('stop');
  try{
    await vmix('StopRecording');
    setRecording(false); msg('Recording stopped.');
  }catch(e){msg('Could not stop vMix recording: '+e.message,true)}
};
$('cancel').onclick=cancelCountdown;
$('seconds').onchange=()=>{save();if(!running){remaining=parseInt($('seconds').value)||10;$('count').textContent=remaining}};
$('host').onchange=save;
load(); checkSync(); setInterval(checkSync,2000);
</script>
</body>
</html>
